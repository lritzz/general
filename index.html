<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NYC Area Flight Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #060b14;
      color: #e2eaf4;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #0d1b2e;
      border-bottom: 1px solid #1e3a5f;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #60a5fa;
    }

    .subtitle {
      font-size: 0.75rem;
      color: #4a7cad;
      margin-top: 1px;
    }

    .header-controls {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .refresh-btn {
      background: #1e3a5f;
      border: 1px solid #2d5a8e;
      color: #93c5fd;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .refresh-btn:hover { background: #2d5a8e; }
    .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      padding: 5px 10px;
      border-radius: 20px;
      border: 1px solid #1e3a5f;
      color: #94a3b8;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #94a3b8;
    }

    .status-dot.live { background: #4ade80; animation: blink 1.5s infinite; }
    .status-dot.loading { background: #fbbf24; animation: blink 0.7s infinite; }
    .status-dot.error { background: #f87171; }

    @keyframes blink {
      0%,100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      flex: 1;
      overflow: hidden;
    }

    /* SIDEBAR */
    .sidebar {
      background: #080f1a;
      border-right: 1px solid #1e3a5f;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-tabs {
      display: flex;
      border-bottom: 1px solid #1e3a5f;
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: #4a7cad;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .tab.active {
      color: #60a5fa;
      border-bottom-color: #60a5fa;
      background: rgba(96,165,250,0.05);
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: #1e3a5f;
      border-bottom: 1px solid #1e3a5f;
      flex-shrink: 0;
    }

    .stat {
      background: #080f1a;
      padding: 10px 8px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.3rem;
      font-weight: 800;
      color: #60a5fa;
    }

    .stat-label {
      font-size: 0.62rem;
      color: #4a7cad;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 1px;
    }

    .search-box {
      padding: 10px;
      border-bottom: 1px solid #1e3a5f;
      flex-shrink: 0;
    }

    .search-box input {
      width: 100%;
      background: #0d1b2e;
      border: 1px solid #1e3a5f;
      border-radius: 6px;
      padding: 7px 10px;
      color: #e2eaf4;
      font-size: 0.8rem;
      outline: none;
    }

    .search-box input:focus { border-color: #2d5a8e; }
    .search-box input::placeholder { color: #4a7cad; }

    .flight-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .flight-list::-webkit-scrollbar { width: 4px; }
    .flight-list::-webkit-scrollbar-track { background: transparent; }
    .flight-list::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 2px; }

    .flight-card {
      background: #0d1b2e;
      border: 1px solid #1a3050;
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.15s;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      align-items: start;
    }

    .flight-card:hover { border-color: #2d5a8e; background: #112035; }
    .flight-card.active { border-color: #60a5fa; background: #0f2040; box-shadow: 0 0 0 1px #60a5fa33; }

    .flight-callsign {
      font-weight: 700;
      font-size: 0.95rem;
      color: #93c5fd;
      font-family: monospace;
    }

    .flight-info {
      font-size: 0.72rem;
      color: #4a7cad;
      margin-top: 2px;
      line-height: 1.6;
    }

    .flight-info span { color: #7ca5cc; }

    .flight-meta {
      text-align: right;
    }

    .altitude-badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      background: #0a2040;
      color: #60a5fa;
      border: 1px solid #1e3a5f;
      font-family: monospace;
      white-space: nowrap;
    }

    .speed-text {
      font-size: 0.68rem;
      color: #4a7cad;
      margin-top: 4px;
      text-align: right;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #2d5a8e;
      gap: 8px;
      font-size: 0.85rem;
      padding: 40px;
      text-align: center;
    }

    .empty-icon { font-size: 2.5rem; }

    /* TFR panel */
    .tfr-panel {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tfr-card {
      background: #0d1b2e;
      border: 1px solid #1a3050;
      border-radius: 8px;
      padding: 12px;
    }

    .tfr-card.active-tfr { border-color: #f87171; background: #1a0d0d; }
    .tfr-card.potential-tfr { border-color: #fbbf24; background: #1a150d; }

    .tfr-title { font-weight: 700; font-size: 0.85rem; margin-bottom: 6px; }
    .tfr-detail { font-size: 0.75rem; color: #7ca5cc; line-height: 1.6; }
    .tfr-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .badge-red { background: rgba(248,113,113,0.2); color: #f87171; border: 1px solid rgba(248,113,113,0.3); }
    .badge-yellow { background: rgba(251,191,36,0.2); color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); }
    .badge-blue { background: rgba(96,165,250,0.2); color: #60a5fa; border: 1px solid rgba(96,165,250,0.3); }

    /* MAP */
    #map { width: 100%; height: 100%; }

    .leaflet-container { background: #060b14 !important; }

    .leaflet-popup-content-wrapper {
      background: #0d1b2e;
      border: 1px solid #2d5a8e;
      border-radius: 10px;
      color: #e2eaf4;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .leaflet-popup-tip { background: #0d1b2e; }

    .popup-callsign { font-weight: 800; font-size: 1rem; font-family: monospace; color: #93c5fd; }
    .popup-row { font-size: 0.78rem; color: #7ca5cc; margin: 3px 0; }
    .popup-row strong { color: #b0cce8; }

    /* Plane icons */
    .plane-marker { background: none; border: none; }

    /* Attribution override */
    .leaflet-control-attribution { background: rgba(6,11,20,0.8) !important; color: #4a7cad !important; }
    .leaflet-control-attribution a { color: #2d5a8e !important; }

    /* Loading overlay */
    #loading-overlay {
      position: fixed; inset: 0; background: rgba(6,11,20,0.85);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; flex-direction: column; gap: 12px;
    }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #1e3a5f;
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text { color: #4a7cad; font-size: 0.85rem; }

    .error-banner {
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.3);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      margin: 8px;
      display: none;
    }

    .last-updated {
      font-size: 0.7rem;
      color: #4a7cad;
    }

    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: 45vh 55vh; }
      .sidebar { border-right: none; border-bottom: 1px solid #1e3a5f; }
    }
  </style>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-text">Fetching live NYC airspace data…</div>
</div>

<header>
  <div>
    <h1>✈ NYC Airspace Tracker</h1>
    <div class="subtitle">Live ADS-B · OpenSky Network · ~40 NM radius around KJFK/KEWR/KLGA/KTEB</div>
  </div>
  <div class="header-controls">
    <div class="status-pill" id="status-pill">
      <div class="status-dot loading" id="status-dot"></div>
      <span id="status-text">Connecting…</span>
    </div>
    <span class="last-updated" id="last-updated"></span>
    <button class="refresh-btn" id="refresh-btn" onclick="fetchFlights()">⟳ Refresh</button>
  </div>
</header>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-tabs">
      <div class="tab active" id="tab-flights" onclick="switchTab('flights')">Flights</div>
      <div class="tab" id="tab-tfr" onclick="switchTab('tfr')">TFRs & Events</div>
    </div>

    <div class="stats-bar">
      <div class="stat">
        <div class="stat-value" id="stat-count">—</div>
        <div class="stat-label">Aircraft</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-arriving">—</div>
        <div class="stat-label">Arrivals</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-high">—</div>
        <div class="stat-label">High-alt</div>
      </div>
    </div>

    <div id="error-banner" class="error-banner"></div>

    <!-- Flights tab -->
    <div id="panel-flights" style="display:flex;flex-direction:column;flex:1;overflow:hidden;">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search callsign, aircraft type…" oninput="filterFlights()" />
      </div>
      <div class="flight-list" id="flight-list"></div>
    </div>

    <!-- TFR / Events tab -->
    <div id="panel-tfr" style="display:none;flex:1;overflow:hidden;">
      <div class="tfr-panel" id="tfr-panel"></div>
    </div>
  </div>

  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────

// NYC bounding box (~40 NM radius around KJFK)
const BOUNDS = {
  lamin: 40.35,
  lomin: -74.80,
  lamax: 41.30,
  lomax: -73.40,
};

const NYC_CENTER = [40.7128, -74.006];

// Key airports
const AIRPORTS = [
  { name: 'JFK', lat: 40.6413, lng: -73.7781, iata: 'KJFK' },
  { name: 'EWR', lat: 40.6895, lng: -74.1745, iata: 'KEWR' },
  { name: 'LGA', lat: 40.7769, lng: -73.8740, iata: 'KLGA' },
  { name: 'TEB', lat: 40.8501, lng: -74.0608, iata: 'KTEB' },
  { name: 'HPN', lat: 41.0670, lng: -73.7076, iata: 'KHPN' },
  { name: 'CDW', lat: 40.8752, lng: -74.2814, iata: 'KCDW' },
];

// MSG area (Madison Square Garden)
const MSG = { lat: 40.7505, lng: -73.9934, name: 'Madison Square Garden' };

// ─── MAP ─────────────────────────────────────────────────────────────────────

const map = L.map('map', {
  center: NYC_CENTER,
  zoom: 10,
  zoomControl: true,
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19,
}).addTo(map);

// Airport markers
AIRPORTS.forEach(ap => {
  L.circleMarker([ap.lat, ap.lng], {
    radius: 6,
    color: '#2d5a8e',
    fillColor: '#0d1b2e',
    fillOpacity: 1,
    weight: 2,
  }).addTo(map)
    .bindTooltip(ap.name, { permanent: true, className: 'airport-label', direction: 'top', offset: [0, -8] });
});

// MSG marker
L.circleMarker([MSG.lat, MSG.lng], {
  radius: 10,
  color: '#fbbf24',
  fillColor: '#fbbf2433',
  fillOpacity: 0.5,
  weight: 2,
  dashArray: '4,4',
}).addTo(map)
  .bindPopup(`<div>
    <div style="font-weight:700;color:#fbbf24">🏟 ${MSG.name}</div>
    <div style="font-size:0.78rem;color:#7ca5cc;margin-top:4px">Rumored event venue this weekend.<br>Watch for potential TFR activity.</div>
  </div>`);

// Custom airport label style
const labelStyle = document.createElement('style');
labelStyle.textContent = `
  .airport-label {
    background: rgba(13,27,46,0.85) !important;
    border: 1px solid #1e3a5f !important;
    border-radius: 4px !important;
    color: #60a5fa !important;
    font-size: 0.72rem !important;
    font-weight: 700 !important;
    padding: 2px 5px !important;
    box-shadow: none !important;
  }
  .airport-label::before { display: none; }
`;
document.head.appendChild(labelStyle);

// ─── STATE ───────────────────────────────────────────────────────────────────

let allFlights = [];
let markers = {};
let activeIcao = null;
let currentTab = 'flights';
let searchTerm = '';

// ─── FETCH ───────────────────────────────────────────────────────────────────

async function fetchFlights() {
  setStatus('loading', 'Fetching…');
  document.getElementById('refresh-btn').disabled = true;

  const url = `https://opensky-network.org/api/states/all?lamin=${BOUNDS.lamin}&lomin=${BOUNDS.lomin}&lamax=${BOUNDS.lamax}&lomax=${BOUNDS.lomax}`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    document.getElementById('loading-overlay').style.display = 'none';
    processFlights(data.states || []);
    setStatus('live', `Live · ${data.states?.length ?? 0} aircraft`);
    document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    hideError();
  } catch (err) {
    document.getElementById('loading-overlay').style.display = 'none';
    setStatus('error', 'Error – retrying…');
    showError(`Could not reach OpenSky Network: ${err.message}. The API has rate limits for anonymous users (1 req/10s). Will retry in 15s.`);
    console.error(err);
    setTimeout(fetchFlights, 15000);
  } finally {
    document.getElementById('refresh-btn').disabled = false;
  }
}

// OpenSky state vector indices:
// 0=icao24, 1=callsign, 2=origin_country, 3=time_position, 4=last_contact,
// 5=longitude, 6=latitude, 7=baro_altitude(m), 8=on_ground, 9=velocity(m/s),
// 10=true_track(deg), 11=vertical_rate(m/s), 12=sensors, 13=geo_altitude(m),
// 14=squawk, 15=spi, 16=position_source

function processFlights(states) {
  allFlights = states
    .filter(s => s[5] != null && s[6] != null) // must have position
    .map(s => ({
      icao24: s[0],
      callsign: (s[1] || '').trim() || s[0].toUpperCase(),
      country: s[2] || '—',
      lon: s[5],
      lat: s[6],
      alt_m: s[7],
      alt_ft: s[7] != null ? Math.round(s[7] * 3.281) : null,
      on_ground: s[8],
      speed_ms: s[9],
      speed_kts: s[9] != null ? Math.round(s[9] * 1.944) : null,
      heading: s[10] || 0,
      vrate: s[11],
      squawk: s[14] || '—',
    }));

  renderList();
  updateMarkers();
  updateStats();
}

// ─── STATS ───────────────────────────────────────────────────────────────────

function updateStats() {
  const airborne = allFlights.filter(f => !f.on_ground);
  const arriving = airborne.filter(f => f.vrate != null && f.vrate < -2);
  const high = airborne.filter(f => f.alt_ft != null && f.alt_ft > 18000);
  document.getElementById('stat-count').textContent = airborne.length;
  document.getElementById('stat-arriving').textContent = arriving.length;
  document.getElementById('stat-high').textContent = high.length;
}

// ─── LIST ────────────────────────────────────────────────────────────────────

function filterFlights() {
  searchTerm = document.getElementById('search-input').value.toLowerCase();
  renderList();
}

function renderList() {
  const list = document.getElementById('flight-list');
  let flights = allFlights.filter(f => !f.on_ground);

  if (searchTerm) {
    flights = flights.filter(f =>
      f.callsign.toLowerCase().includes(searchTerm) ||
      f.icao24.toLowerCase().includes(searchTerm) ||
      f.country.toLowerCase().includes(searchTerm) ||
      (f.squawk && f.squawk.includes(searchTerm))
    );
  }

  // Sort by altitude descending
  flights.sort((a, b) => (b.alt_ft || 0) - (a.alt_ft || 0));

  if (flights.length === 0) {
    list.innerHTML = `<div class="empty-state">
      <div class="empty-icon">✈</div>
      <div>${searchTerm ? 'No flights match your search.' : 'No airborne flights found in range.'}</div>
    </div>`;
    return;
  }

  list.innerHTML = flights.map(f => {
    const vIcon = f.vrate == null ? '→' : f.vrate > 2 ? '↑' : f.vrate < -2 ? '↓' : '→';
    const vColor = f.vrate == null ? '#4a7cad' : f.vrate > 2 ? '#4ade80' : f.vrate < -2 ? '#f87171' : '#94a3b8';
    const altText = f.alt_ft != null ? `${f.alt_ft.toLocaleString()} ft` : '—';
    const spdText = f.speed_kts != null ? `${f.speed_kts} kts` : '—';

    return `<div class="flight-card${activeIcao === f.icao24 ? ' active' : ''}" onclick="selectFlight('${f.icao24}')">
      <div>
        <div class="flight-callsign">${f.callsign}</div>
        <div class="flight-info">
          <span>${f.icao24.toUpperCase()}</span> · ${f.country}<br>
          Squawk <span>${f.squawk}</span> · Hdg <span>${Math.round(f.heading)}°</span>
        </div>
      </div>
      <div class="flight-meta">
        <div class="altitude-badge">${altText}</div>
        <div class="speed-text">${spdText} <span style="color:${vColor}">${vIcon}</span></div>
      </div>
    </div>`;
  }).join('');
}

// ─── MARKERS ─────────────────────────────────────────────────────────────────

function planeColor(f) {
  if (f.alt_ft == null) return '#4a7cad';
  if (f.alt_ft > 30000) return '#60a5fa';
  if (f.alt_ft > 18000) return '#93c5fd';
  if (f.alt_ft > 5000) return '#34d399';
  return '#fbbf24'; // low altitude / approach
}

function makePlaneIcon(f) {
  const color = planeColor(f);
  const angle = f.heading || 0;
  return L.divIcon({
    className: 'plane-marker',
    html: `<div style="
      transform: rotate(${angle}deg);
      font-size: 1rem;
      color: ${color};
      filter: drop-shadow(0 0 3px ${color}88);
      line-height: 1;
    ">✈</div>`,
    iconSize: [18, 18],
    iconAnchor: [9, 9],
  });
}

function updateMarkers() {
  const currentIcaos = new Set(allFlights.filter(f => !f.on_ground).map(f => f.icao24));

  // Remove stale
  for (const icao of Object.keys(markers)) {
    if (!currentIcaos.has(icao)) {
      markers[icao].remove();
      delete markers[icao];
    }
  }

  // Add/update
  allFlights.filter(f => !f.on_ground).forEach(f => {
    if (markers[f.icao24]) {
      markers[f.icao24].setLatLng([f.lat, f.lon]);
      markers[f.icao24].setIcon(makePlaneIcon(f));
      markers[f.icao24].setPopupContent(buildPopup(f));
    } else {
      const m = L.marker([f.lat, f.lon], { icon: makePlaneIcon(f) })
        .addTo(map)
        .bindPopup(buildPopup(f));
      m.on('click', () => selectFlight(f.icao24));
      markers[f.icao24] = m;
    }
  });
}

function buildPopup(f) {
  const altText = f.alt_ft != null ? `${f.alt_ft.toLocaleString()} ft` : '—';
  const spdText = f.speed_kts != null ? `${f.speed_kts} kts` : '—';
  const vrText = f.vrate != null ? `${f.vrate > 0 ? '+' : ''}${Math.round(f.vrate * 197)} fpm` : '—';
  return `<div style="min-width:180px">
    <div class="popup-callsign">${f.callsign}</div>
    <div class="popup-row"><strong>ICAO24:</strong> ${f.icao24.toUpperCase()}</div>
    <div class="popup-row"><strong>Country:</strong> ${f.country}</div>
    <div class="popup-row"><strong>Altitude:</strong> ${altText}</div>
    <div class="popup-row"><strong>Speed:</strong> ${spdText}</div>
    <div class="popup-row"><strong>V/S:</strong> ${vrText}</div>
    <div class="popup-row"><strong>Heading:</strong> ${Math.round(f.heading)}°</div>
    <div class="popup-row"><strong>Squawk:</strong> ${f.squawk}</div>
    <div class="popup-row"><strong>Position:</strong> ${f.lat.toFixed(4)}°, ${f.lon.toFixed(4)}°</div>
  </div>`;
}

// ─── SELECT ──────────────────────────────────────────────────────────────────

function selectFlight(icao) {
  activeIcao = icao;
  const f = allFlights.find(x => x.icao24 === icao);
  if (!f) return;

  renderList();

  if (markers[icao]) {
    map.flyTo([f.lat, f.lon], 12, { animate: true, duration: 0.8 });
    markers[icao].openPopup();
  }

  // Scroll card into view
  setTimeout(() => {
    const cards = document.querySelectorAll('.flight-card');
    cards.forEach(c => { if (c.classList.contains('active')) c.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); });
  }, 50);
}

// ─── TABS ────────────────────────────────────────────────────────────────────

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-flights').classList.toggle('active', tab === 'flights');
  document.getElementById('tab-tfr').classList.toggle('active', tab === 'tfr');
  document.getElementById('panel-flights').style.display = tab === 'flights' ? 'flex' : 'none';
  document.getElementById('panel-tfr').style.display = tab === 'tfr' ? 'flex' : 'none';

  if (tab === 'tfr') renderTFR();
}

// ─── STATUS ──────────────────────────────────────────────────────────────────

function setStatus(state, text) {
  const dot = document.getElementById('status-dot');
  dot.className = `status-dot ${state}`;
  document.getElementById('status-text').textContent = text;
}

function showError(msg) {
  const el = document.getElementById('error-banner');
  el.textContent = msg;
  el.style.display = 'block';
}

function hideError() {
  document.getElementById('error-banner').style.display = 'none';
}

// ─── AUTO-REFRESH ────────────────────────────────────────────────────────────

// OpenSky anonymous rate limit: 1 request per 10 seconds, 400 per day
// We poll every 30 seconds to stay well within limits
fetchFlights();
setInterval(fetchFlights, 30000);
</script>
